<!DOCTYPE html>
<html lang="en">
<head>

     <nav>

        <ul>
            <li><a href="../index.html">Home</a></li>

<main>
    <div class="counters">
        <div class="question-counter">
            <h2>Questions</h2>
            <p id="question-counter">0 of 0</p>

        <div class="scoreboard">
            <h2>Score</h2>
            <p id="score-counter">0</p>
        </div>
    </div>
    <!-- Questions Section -->
     <div class="question-container">
        <h3 id="question"></h3>
        <ol class="multichoice">
            <!-- <li></li>
            <li></li>
            <li></li>
            <li></li> -->
        </ol>
        <p id="result"> </p>
        <button class="startBtn"> Start</button>
        <div class="btnControl hide">
    <button class="prevBtn"> Prev</button>
    <button class="nextBtn"> Next</button>


        </div>
     </div>
</main>
